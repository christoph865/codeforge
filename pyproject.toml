[project]
name = "codeforge"
version = "0.1.0"
description = "Automated spec-to-code AI agent chain: GitLab issue -> technical spec -> code scaffold + tests -> Merge Request, with human approval gates and audit logging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christoph" }]
dependencies = [
    "anthropic>=0.34.0",
    "python-gitlab>=4.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1",
    "mcp>=2.0,<3.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
    "ruff>=0.6.0",
]

[project.scripts]
codeforge = "codeforge.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
